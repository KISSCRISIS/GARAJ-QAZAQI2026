# Netlify configuration for Employee Private Parking Access System
# هذا المشروع Static HTML فقط.
# لا يحتاج npm ولا build command.

[build]
  publish = "."
  command = ""

# Keep all HTML pages directly accessible:
# /index.html
# /verify.html
# /login.html
# /admin_dashboard.html

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline';"
    Permissions-Policy = "camera=(self), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store"
